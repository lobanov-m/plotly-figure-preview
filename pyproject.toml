[project]
name = "plotly-vsix-sandbox"
version = "0.1.0"
description = "Throwaway environment for manually exercising the Plotly & Image Preview extension."
requires-python = ">=3.10"
dependencies = [
    "plotly>=6.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "pillow>=10.0",
]

[dependency-groups]
# Optional: `uv sync --group torch` to exercise the tensor fixtures in sample_images.py.
torch = ["torch>=2.0"]

[tool.uv]
# Sandbox only — there is no package here to build or install.
package = false
